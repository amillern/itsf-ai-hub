server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent Nginx from appending internal port :8080 or absolute scheme on reverse proxy redirects
    absolute_redirect off;
    port_in_redirect off;

    # Maximum Gzip Compression & CWV Optimization
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # Strict file routing with real =404 fallback (prevents SPA fallback masking 404s as 200)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed Astro CSS & JS bundles - 365 days immutable
    location ^~ /_astro/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static media assets with stable names - 7 days short cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    error_page 404 /404.html;
}
